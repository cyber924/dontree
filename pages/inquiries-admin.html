<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>상담 문의 관리 | 코끼리 관리자</title><style>:root{--navy:#041f30;--blue:#0789b7;--paper:#f4f7f9;--line:#dce6eb;--muted:#718795}*{box-sizing:border-box}body{margin:0;font:13px/1.55 Pretendard,"Noto Sans KR",sans-serif;background:var(--paper);color:#082f43}a{text-decoration:none;color:inherit}button{font:inherit}.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:224px;background:var(--navy);color:#bdd0d9;padding:22px 16px}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;padding:5px 8px 25px}.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#45cee9;color:#063047}.side small{display:block;padding:8px 12px;color:#6f8c9a;font-size:10px;letter-spacing:.12em}.menu{display:grid;gap:5px}.menu a{padding:11px 12px;border-radius:9px;font-weight:700}.menu a.active,.menu a:hover{background:#0b3a50;color:#fff}.menu .disabled{opacity:.48}.main{grid-column:2}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0}.top b{font-size:15px}.top div{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px}.content{width:min(1080px,calc(100% - 40px));margin:28px auto}.heading h1{font-size:23px;margin:0}.heading p{color:var(--muted);margin:3px 0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font-size:24px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.btn{border:0;border-radius:8px;padding:8px 11px;background:#eaf2f5;color:#365767;font-weight:800;cursor:pointer}.btn.dark{background:var(--blue);color:#fff}.btn.danger{background:#fff0ef;color:#c9362b}.items{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:10px;padding:15px}.item.new{border-left:4px solid #31bce1}.item-head{display:flex;justify-content:space-between;gap:15px}.item h2{font-size:14px;margin:0 0 5px}.meta{color:var(--muted);font-size:11px}.body{white-space:pre-wrap;background:#f6f9fa;border-radius:8px;padding:12px;margin:12px 0}.actions{display:flex;gap:7px}.empty{text-align:center;color:var(--muted);padding:45px}.error{color:#bd3026}@media(max-width:760px){.app{display:block}.side{position:static;width:100%;padding:12px}.brand{padding:4px 7px 10px}.side small{display:none}.menu{display:flex;overflow:auto}.menu a{white-space:nowrap}.main{width:100%}.stats{grid-template-columns:1fr}.content{width:calc(100% - 24px)}.top{padding:0 15px}.top span{display:none}}</style></head><body><div class="app"><aside class="side"><a class="brand" href="/admin/blog"><span class="logo">K</span>코끼리 관리자</a><small>ADMIN MENU</small><nav class="menu"><a href="/admin/blog">▦ 대시보드</a><a href="/admin/blog">✎ 블로그 관리</a><a href="/admin/blog#editor">＋ 새 글 작성</a><a class="active" href="/admin/inquiries">☎ 상담 문의</a><a class="disabled" href="#">⚙ 사이트 설정</a></nav></aside><section class="main"><header class="top"><b>상담 문의 관리</b><div><span id="user">인증 확인 중...</span><button class="btn" id="logout">로그아웃</button></div></header><main class="content"><div class="heading"><h1>접수된 문의</h1><p>고객이 문의하기 페이지에서 남긴 상담 요청을 확인합니다.</p></div><section class="stats"><div class="stat"><span>전체 문의</span><b id="total">0</b></div><div class="stat"><span>신규 문의</span><b id="newCount">0</b></div><div class="stat"><span>처리 완료</span><b id="doneCount">0</b></div></section><section class="panel"><div class="toolbar"><button class="btn dark filter" data-status="all">전체</button><button class="btn filter" data-status="new">신규</button><button class="btn filter" data-status="done">완료</button><a class="btn" href="/contact" target="_blan
