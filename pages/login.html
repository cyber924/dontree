<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>관리자 로그인 | 돈트리대부중개</title>
  <style>
    :root{--navy:#062f45;--blue:#0789b7;--cyan:#51d4f2;--paper:#f3f7f9;--line:#d8e5eb;--muted:#728895}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Pretendard,"Noto Sans KR",sans-serif;background:var(--paper);color:#082f43}a{text-decoration:none;color:inherit}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.shell{width:min(1080px,calc(100% - 32px));margin:auto}.top .shell{display:flex;align-items:center}.brand{font-weight:900;font-size:16px}.brand small{display:block;font-size:10px;color:var(--muted)}.nav{margin-left:auto;display:flex;gap:18px;font-weight:700;font-size:12px}.login-wrap{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:36px 16px}.card{width:min(840px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 60px #082f4312}.intro{background:linear-gradient(145deg,#052b40,#0b5874);color:#fff;padding:52px 42px}.mark{display:grid;place-items:center;width:45px;height:45px;background:var(--cyan);color:#063047;border-radius:12px;font-weight:900;margin-bottom:50px}.intro h1{font-size:27px;line-height:1.35;margin:0 0 12px}.intro p{color:#b8d0db;font-size:13px}.benefits{display:grid;gap:10px;margin-top:32px;font-size:12px;color:#d3e5ec}.formbox{padding:46px 42px}.formbox h2{font-size:23px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px}.field{margin-top:15px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.input{width:100%;border:1px solid #cddde5;border-radius:9px;padding:11px 12px;font:inherit;outline:none}.input:focus{border-color:#22add2;box-shadow:0 0 0 3px #22add216}.pass{position:relative}.pass button{position:absolute;right:7px;top:7px;border:0;background:#eef4f6;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer}.keep{display:flex;align-items:center;gap:7px;margin-top:13px;color:#5e7582;font-size:12px}.btn{width:100%;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:900;padding:12px;margin-top:18px;cursor:pointer}.btn:disabled{opacity:.6}.notice{margin-top:18px;padding:10px 12px;background:#f1f7f9;border-radius:8px;color:#6b818d;font-size:11px}.error{color:#be3328;font-size:12px}.success{color:#087f66;font-size:12px}@media(max-width:700px){.card{grid-template-columns:1fr;max-width:440px}.intro{display:none}.formbox{padding:34px 25px}}
  </style>
</head>
<body>
  <header class="top"><div class="shell"><a class="brand" href="/">신용카드 대납·법인카드대납<small>정식 등록 대부중개 상담 안내</small></a><nav class="nav"><a href="/">홈</a><a href="/blog">블로그</a></nav></div></header>
  <main class="login-wrap"><section class="card"><div class="intro"><div class="mark">K</div><h1>안전한 콘텐츠<br>관리자 센터</h1><p>블로그 글 작성부터 AI 콘텐츠 생성과 공개 관리까지 한곳에서 진행하세요.</p><div class="benefits"><span>✓ 로그인 상태 안전하게 유지</span><span>✓ Gemini 금융 콘텐츠 생성</span><span>✓ 글 수정·공개·삭제 관리</span></div></div><div class="formbox"><h2>관리자 로그인</h2><p id="state" class="muted">등록된 관리자 계정으로 로그인하세요.</p><form id="form"><div class="field"><label>이메일</label><input class="input" id="email" type="email" value="cyber924@naver.com" autocomplete="username" required></div><div class="field"><label>비밀번호</label><div class="pass"><input class="input" id="password" type="password" autocomplete="current-password" required><button id="show" type="button">보기</button></div></div><label class="keep"><input id="keep" type="checkbox" checked> 이 브라우저에서 로그인 유지</label><button class="btn" id="submit">관리자 로그인</button><p id="msg"></p></form><div class="notice">공용 컴퓨터에서는 사용 후 관리자 화면의 로그아웃 버튼을 눌러주세요.</div></div></section></main>
  <script type="module">
    import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence,browserSessionPersistence,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    const config={apiKey:"AIzaSyCh2jJOIPuY64FTP50zMeSN1PbYDHWW1Lo",authDomain:"pinstory-26738.firebaseapp.com",projectId:"pinstory-26738",storageBucket:"pinstory-26738.firebasestorage.app",messagingSenderId:"841861837489",appId:"1:841861837489:web:1dcf9c86767a8edf762890"};
    const auth=getAuth(initializeApp(config)),ADMIN="cyber924@naver.com",E=id=>document.getElementById(id);let checked=false;
    onAuthStateChanged(auth,user=>{if(checked)return;checked=true;if(user&&(user.email||"").toLowerCase()===ADMIN){E("state").textContent="로그인 상태가 유지되고 있습니다. 관리자 화면으로 이동합니다.";E("state").className="success";setTimeout(()=>location.replace("/admin/blog"),350)}});
    E("show").onclick=()=>{const visible=E("password").type==="text";E("password").type=visible?"password":"text";E("show").textContent=visible?"보기":"숨기기"};
    E("form").onsubmit=async event=>{event.preventDefault();E("submit").disabled=true;E("submit").textContent="로그인 확인 중...";E("msg").textContent="";try{await setPersistence(auth,E("keep").checked?browserLocalPersistence:browserSessionPersistence);const result=await signInWithEmailAndPassword(auth,E("email").value.trim(),E("password").value);if((result.user.email||"").toLowerCase()!==ADMIN){await signOut(auth);throw Error("관리자 계정이 아닙니다.")}location.replace("/admin/blog")}catch(error){E("msg").textContent=error.code==="auth/unauthorized-domain"?"Firebase 승인 도메인 설정을 확인하세요.":"이메일 또는 비밀번호를 확인하세요.";E("msg").className="error";E("submit").disabled=false;E("submit").textContent="관리자 로그인"}};
  </script>
</body>
</html>
