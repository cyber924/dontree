<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>블로그 관리 | 돈트리대부중개</title>
  <style>
    :root{--navy:#062f45;--blue:#0789b7;--cyan:#50d0ef;--paper:#f4f7f9;--line:#dce6eb;--muted:#718795;--white:#fff;--red:#c9362b}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Pretendard,"Noto Sans KR",sans-serif;background:var(--paper);color:#082f43}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:224px 1fr}.side{position:fixed;inset:0 auto 0 0;width:224px;background:#041f30;color:#bdd0d9;padding:22px 16px}.side-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;font-size:15px;padding:5px 8px 25px}.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#53ddf8,#0d8ebb);color:#05283b}.side small{display:block;padding:8px 12px;color:#6f8c9a;font-size:10px;font-weight:800;letter-spacing:.12em}.menu{display:grid;gap:5px}.menu a{padding:11px 12px;border-radius:9px;font-weight:700;font-size:13px}.menu a:hover,.menu a.active{background:#0b3a50;color:#fff}.menu .disabled{opacity:.48}.side-bottom{position:absolute;left:16px;right:16px;bottom:20px}.side-bottom a{display:block;padding:10px 12px;border:1px solid #265064;border-radius:9px;font-size:12px}.main{grid-column:2;min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:10}.top-title{font-weight:900;font-size:15px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}.user{color:var(--muted);font-size:12px}.content{width:min(1180px,calc(100% - 40px));margin:26px auto 60px}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.heading h1{font-size:23px;margin:0 0 3px}.heading p{margin:0;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 2px 8px #082f4308}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel h2{font-size:17px;margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.input,textarea,select{width:100%;border:1px solid #cfdee6;border-radius:8px;background:#fff;padding:9px 11px;color:#082f43;outline:none}.input:focus,textarea:focus,select:focus{border-color:#25acd1;box-shadow:0 0 0 3px #25acd115}textarea{min-height:78px;resize:vertical}#content{min-height:310px}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:800;font-size:12px;cursor:pointer;background:var(--cyan);color:#063047}.btn.dark{background:var(--blue);color:#fff}.btn.ghost{background:#edf4f7;color:#365767}.btn.danger{background:#fff0ef;color:var(--red)}.btn:disabled{opacity:.55;cursor:wait}.ai-box{display:flex;align-items:center;gap:10px;background:#f1f9fc;border:1px solid #d6edf4;border-radius:10px;padding:10px;margin-bottom:12px}.ai-box .input{background:#fff}.ai-status{font-size:11px;color:var(--muted);margin:6px 0 0}.actions,.post-actions{display:flex;gap:7px;align-items:center}.form-actions{display:flex;gap:8px;padding-top:4px}.posts{display:grid;gap:9px;max-height:720px;overflow:auto;padding-right:3px}.post{border:1px solid var(--line);border-radius:10px;padding:12px}.post b{display:block;font-size:13px;line-height:1.35}.post small{display:block;color:var(--muted);font-size:11px;margin:3px 0 9px}.post .btn{padding:6px 9px;font-size:11px}.message{font-size:12px;margin:10px 0 0}.error{color:#bd2f25}.success{color:#087f66}.muted{color:var(--muted)}@media(max-width:900px){.app{display:block}.side{position:static;width:100%;padding:12px}.side-brand{padding:4px 7px 10px}.side small,.side-bottom{display:none}.menu{display:flex;overflow:auto}.menu a{white-space:nowrap}.main{width:100%}.layout{grid-template-columns:1fr}.top{padding:0 16px}.content{width:min(100% - 24px,720px)}.user{display:none}}@media(max-width:560px){.grid2{grid-template-columns:1fr}.ai-box{display:block}.ai-box .btn{margin-top:8px}.heading{align-items:start}.panel{padding:16px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="side-brand" href="/admin/blog"><span class="logo">K</span><span>코끼리 관리자</span></a>
      <small>ADMIN MENU</small>
      <nav class="menu">
        <a href="/admin/blog">▦ 대시보드</a>
        <a class="active" href="/admin/blog">✎ 블로그 관리</a>
        <a href="#editor">＋ 새 글 작성</a>
        <a href="/admin/inquiries">◫ 상담 문의</a>
        <a class="disabled" href="#">⚙ 사이트 설정</a>
      </nav>
      <div class="side-bottom"><a href="/blog" target="_blank">↗ 공개 사이트 보기</a></div>
    </aside>
    <section class="main">
      <header class="top"><div class="top-title">블로그 관리</div><div class="top-actions"><span id="user" class="user">인증 확인 중...</span><button id="logout" class="btn ghost">로그아웃</button></div></header>
      <main class="content">
        <div class="heading"><div><h1>콘텐츠 관리</h1><p>AI로 금융 글을 만들고 검토한 뒤 공개하세요.</p></div><a class="btn dark" href="/blog" target="_blank">블로그 보기</a></div>
        <div class="layout">
          <section class="panel" id="editor">
            <div class="panel-head"><h2 id="formTitle">새 글 작성</h2><button class="btn ghost" id="newBtn" type="button">입력 초기화</button></div>
            <form id="form">
              <input id="docId" type="hidden">
              <div class="grid2"><div class="field"><label>글 번호</label><input class="input" id="postNumber" type="number" readonly></div><div class="field"><label>공개 상태</label><select id="status"><option value="draft">임시저장</option><option value="published">공개</option></select></div></div>
              <div class="field"><label>AI 글 주제 또는 제목</label><input class="input" id="title" placeholder="예: 법인카드 대납 상담 전 확인사항" required><div class="ai-box"><button class="btn dark" id="aiBtn" type="button">Gemini AI 글 생성</button><span id="aiStatus" class="ai-status">주제를 입력한 뒤 AI 글 생성을 누르세요.</span></div></div>
              <div class="field"><label>검색 설명</label><textarea id="summary" placeholder="검색 결과에 표시할 설명"></textarea></div>
              <div class="grid2"><div class="field"><label>카테고리</label><input class="input" id="category" value="신용카드 대납"></div><div class="field"><label>대표 이미지 URL</label><input class="input" id="imageUrl" placeholder="https://images.unsplash.com/..."></div></div>
              <div class="field"><label>본문</label><textarea id="content" placeholder="## 소제목 형식으로 본문을 작성하세요." required></textarea></div>
              <div class="form-actions"><button class="btn dark">저장</button><button class="btn danger" id="deleteBtn" type="button" hidden>현재 글 삭제</button></div>
              <p id="msg" class="message"></p>
            </form>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>저장된 글</h2><button class="btn ghost" id="seedBtn" type="button">예시 글 1개</button></div>
            <div id="list" class="posts"><p class="muted">불러오는 중...</p></div>
          </section>
        </div>
      </main>
    </section>
  </div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
